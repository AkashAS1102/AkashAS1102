name: Refresh profile statistics

on:
  schedule:
    - cron: '15 0 * * 1'
  workflow_dispatch:
  push:
    paths:
      - scripts/update_stats.py
      - .github/workflows/profile-stats.yml

permissions:
  contents: write

concurrency:
  group: profile-statistics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Generate cards from public GitHub metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_stats.py
      - name: Commit refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-stats.svg assets/activity.svg assets/languages.svg
          if ! git diff --cached --quiet; then
            git commit -m "Refresh GitHub profile statistics"
            git push
          fi
